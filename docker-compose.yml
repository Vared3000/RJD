name: workwear-erp

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workwear_erp}
      POSTGRES_USER: ${POSTGRES_USER:-workwear_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    expose:
      - '5432'
    networks:
      - database
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-workwear_app} -d ${POSTGRES_DB:-workwear_erp}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Укажите LAN-адрес системы в .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-workwear_app}:${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в .env}@postgres:5432/${POSTGRES_DB:-workwear_erp}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Укажите JWT_ACCESS_SECRET в .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Укажите JWT_REFRESH_SECRET в .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      BOOTSTRAP_ADMIN_LOGIN: ${BOOTSTRAP_ADMIN_LOGIN:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Укажите BOOTSTRAP_ADMIN_PASSWORD в .env}
    expose:
      - '4000'
    volumes:
      - server_uploads:/app/uploads
    networks:
      - database
      - application
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '${LAN_BIND_ADDRESS:?Укажите постоянный LAN IPv4 сервера в .env}:80:80'
    networks:
      - application
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost/ >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  server_uploads:

networks:
  database:
    internal: true
  application:
